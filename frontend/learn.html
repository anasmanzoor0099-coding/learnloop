<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open a LearnLoop lesson, follow the curriculum, and track your progress."
    />
    <title>Learning — LearnLoop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/learn.css" />
  </head>
  <body data-page="learn">
    <a class="skip-link" href="#lesson-main">Skip to lesson</a>

    <header class="site-header" data-header>
      <div class="container nav">
        <a class="brand" href="/index.html" aria-label="LearnLoop home">
          <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
            <path d="M18 4.5c7.46 0 13.5 6.04 13.5 13.5S25.46 31.5 18 31.5 4.5 25.46 4.5 18 10.54 4.5 18 4.5Z" />
            <path d="M11.5 18c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5-2.91 6.5-6.5 6.5" />
          </svg>
          <span>LearnLoop</span>
        </a>

        <button
          class="menu-toggle"
          type="button"
          data-menu-toggle
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="site-navigation"
        >
          <span></span><span></span>
        </button>

        <nav class="nav-links" id="site-navigation" data-nav aria-label="Main navigation">
          <a href="/courses.html">Courses</a>
          <a href="/dashboard.html">Dashboard</a>
          <a href="/index.html#how">How it works</a>
          <a href="/studio.html" data-studio-link hidden>Studio</a>
        </nav>

        <div class="nav-actions" data-nav-actions>
          <a class="button button-ghost button-sm nav-login" href="/login.html">Log in</a>
          <a class="button button-primary button-sm" href="/register.html">Get started</a>
        </div>
      </div>
    </header>

    <main class="learn-page" id="lesson-main">
      <div class="learn-shell" data-learn-shell>
        <aside class="learn-sidebar" data-learn-sidebar>
          <div class="learn-sidebar-head">
            <a class="learn-back" href="/courses.html">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5" /></svg>
              All courses
            </a>
            <h1 data-learn-title>Loading course…</h1>
            <div class="learn-progress-head">
              <span data-learn-progress-label>0% complete</span>
              <span data-learn-progress-count>0 / 0</span>
            </div>
            <div class="progress-track learn-progress-track">
              <span data-learn-progress-bar></span>
            </div>
            <button
              class="lesson-toggle"
              type="button"
              data-lesson-toggle
              aria-expanded="false"
              aria-controls="lesson-list"
            >
              Show lessons
            </button>
          </div>
          <div class="lesson-list" id="lesson-list" data-lesson-list>
            <div class="lesson-list-loading">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>
        </aside>

        <section class="learn-main">
          <div class="learn-topbar">
            <a class="learn-course-link" href="/courses.html" data-learn-course-link>
              Back to course
            </a>
            <span class="learn-save-note">Progress saves automatically</span>
          </div>

          <article class="lesson-article" data-lesson-article aria-live="polite">
            <div class="lesson-loading">
              <div class="loading-line loading-line-sm"></div>
              <div class="loading-line loading-line-lg"></div>
              <div class="loading-line loading-line-md"></div>
              <div class="loading-paragraph"></div>
              <div class="loading-paragraph"></div>
            </div>
          </article>
        </section>
      </div>
    </main>

    <div class="toast-stack" data-toast-stack aria-live="polite"></div>
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/learn.js"></script>
  </body>
</html>
